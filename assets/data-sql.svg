  <rect x="72" y="194" width="570" height="463" fill="#0d1324"/><path d="M642 194v463" stroke="#2a3347"/><text x="92" y="226" fill="#4f5d73" font-family="monospace" font-size="12">01</text><text x="92" y="252" fill="#4f5d73" font-family="monospace" font-size="12">02</text><text x="92" y="278" fill="#4f5d73" font-family="monospace" font-size="12">03</text><text x="92" y="304" fill="#4f5d73" font-family="monospace" font-size="12">04</text><text x="92" y="330" fill="#4f5d73" font-family="monospace" font-size="12">05</text><text x="92" y="356" fill="#4f5d73" font-family="monospace" font-size="12">06</text><text x="92" y="382" fill="#4f5d73" font-family="monospace" font-size="12">07</text><text x="92" y="408" fill="#4f5d73" font-family="monospace" font-size="12">08</text>
  <g font-family="monospace" font-size="14"><text x="128" y="226" fill="#c78bf0">SELECT</text><text x="190" y="226" fill="#d7e1ef">v.id_venta,</text><text x="148" y="252" fill="#d7e1ef">c.nombre</text><text x="232" y="252" fill="#7e8ca2">AS</text><text x="260" y="252" fill="#e8c57c">cliente,</text><text x="148" y="278" fill="#d7e1ef">v.fecha, v.total</text><text x="128" y="304" fill="#c78bf0">FROM</text><text x="176" y="304" fill="#7fc9e8">venta</text><text x="225" y="304" fill="#d7e1ef">v</text><text x="128" y="330" fill="#c78bf0">INNER JOIN</text><text x="225" y="330" fill="#7fc9e8">cliente</text><text x="290" y="330" fill="#d7e1ef">c</text><text x="148" y="356" fill="#c78bf0">ON</text><text x="176" y="356" fill="#d7e1ef">v.id_cliente = c.id_cliente</text><text x="128" y="382" fill="#c78bf0">WHERE</text><text x="183" y="382" fill="#d7e1ef">v.estado =</text><text x="285" y="382" fill="#8fd6a8">'APROBADA'</text><text x="128" y="408" fill="#c78bf0">ORDER BY</text><text x="218" y="408" fill="#d7e1ef">v.fecha</text><text x="283" y="408" fill="#c78bf0">DESC</text><text x="324" y="408" fill="#d7e1ef">;</text></g>
