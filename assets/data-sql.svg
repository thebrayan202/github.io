<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Consulta SQL y resultado comercial</title><desc id="desc">Editor SQL con consulta relacionada y tabla de resultados.</desc>
