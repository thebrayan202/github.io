  <text x="678" y="232" fill="#d9e2ef" font-family="Arial,sans-serif" font-size="15" font-weight="700">Resultado</text><text x="1057" y="232" fill="#6c7b91" font-family="Arial,sans-serif" font-size="10">3 REGISTROS</text><rect x="678" y="258" width="414" height="38" rx="6" fill="#222b3e"/><g fill="#8592a6" font-family="Arial,sans-serif" font-size="9" font-weight="700"><text x="694" y="282">ID</text><text x="747" y="282">CLIENTE</text><text x="893" y="282">FECHA</text><text x="1012" y="282">TOTAL</text></g>
