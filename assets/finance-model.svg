<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Proceso analítico de MiPresupuesto</title>
  <desc id="desc">Flujo desde datos ficticios hasta limpieza, modelo, medidas, validación y dashboard.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10251f"/><stop offset="1" stop-color="#08130f"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#55dfae"/></marker></defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <text x="75" y="82" fill="#fff" font-size="33" font-weight="700" font-family="Arial, sans-serif">MiPresupuesto · Proceso de datos</text><text x="75" y="114" fill="#7e9990" font-size="16" font-family="Arial, sans-serif">Preparación reproducible y validación antes de visualizar</text>
  <rect x="75" y="155" width="1450" height="246" rx="23" fill="#12231e" stroke="#29483e"/>
  <text x="105" y="196" fill="#55dfae" font-size="14" letter-spacing="2" font-family="Arial, sans-serif">PIPELINE ANALÍTICO</text>
  <g font-family="Arial, sans-serif"><rect x="105" y="228" width="220" height="130" rx="17" fill="#1a3029"/><text x="132" y="263" fill="#78a394" font-size="13">01 · ORIGEN</text><text x="132" y="297" fill="#fff" font-size="17" font-weight="700">Datos ficticios</text><text x="132" y="324" fill="#8ba49b" font-size="13">Movimientos y presupuesto</text>
  <rect x="389" y="228" width="220" height="130" rx="17" fill="#1a3029"/><text x="416" y="263" fill="#78a394" font-size="13">02 · CALIDAD</text><text x="416" y="297" fill="#fff" font-size="17" font-weight="700">Limpiar y clasificar</text><text x="416" y="324" fill="#8ba49b" font-size="13">Formatos, nulos y duplicados</text>
  <rect x="673" y="228" width="220" height="130" rx="17" fill="#1a3029"/><text x="700" y="263" fill="#78a394" font-size="13">03 · MODELO</text><text x="700" y="297" fill="#fff" font-size="17" font-weight="700">Relacionar tablas</text><text x="700" y="324" fill="#8ba49b" font-size="13">Fecha, categoría y movimiento</text>
  <rect x="957" y="228" width="220" height="130" rx="17" fill="#1a3029"/><text x="984" y="263" fill="#78a394" font-size="13">04 · CÁLCULO</text><text x="984" y="297" fill="#fff" font-size="17" font-weight="700">Crear medidas</text><text x="984" y="324" fill="#8ba49b" font-size="13">Gasto, ahorro y cumplimiento</text>
  <rect x="1241" y="228" width="254" height="130" rx="17" fill="#173a2f" stroke="#34725d"/><text x="1268" y="263" fill="#77bd9f" font-size="13">05 · RESULTADO</text><text x="1268" y="297" fill="#55dfae" font-size="17" font-weight="700">Dashboard validado</text><text x="1268" y="324" fill="#94b9aa" font-size="13">Indicadores y conclusiones</text></g>
  <g stroke="#55dfae" stroke-width="3" marker-end="url(#a)"><line x1="325" y1="293" x2="378" y2="293"/><line x1="609" y1="293" x2="662" y2="293"/><line x1="893" y1="293" x2="946" y2="293"/><line x1="1177" y1="293" x2="1230" y2="293"/></g>

  <rect x="75" y="431" width="640" height="391" rx="23" fill="#12231e" stroke="#29483e"/>
  <text x="105" y="474" fill="#55dfae" font-size="14" letter-spacing="2" font-family="Arial, sans-serif">CONTROL DE CALIDAD</text>
  <g font-family="Arial, sans-serif"><text x="105" y="520" fill="#8fa69e" font-size="14">REGLA</text><text x="500" y="520" fill="#8fa69e" font-size="14">RESULTADO</text><line x1="105" y1="539" x2="685" y2="539" stroke="#2d493f"/>
  <text x="105" y="578" fill="#edf5f2" font-size="15">Fechas con formato único</text><rect x="500" y="556" width="140" height="30" rx="15" fill="#1e4337"/><text x="532" y="577" fill="#55dfae" font-size="13">Validado</text>
  <text x="105" y="629" fill="#edf5f2" font-size="15">Categorías vacías</text><rect x="500" y="607" width="140" height="30" rx="15" fill="#2d3520"/><text x="527" y="628" fill="#f2c55c" font-size="13">Corregidas</text>
  <text x="105" y="680" fill="#edf5f2" font-size="15">Movimientos duplicados</text><rect x="500" y="658" width="140" height="30" rx="15" fill="#2d3520"/><text x="526" y="679" fill="#f2c55c" font-size="13">Eliminados</text>
  <text x="105" y="731" fill="#edf5f2" font-size="15">Totales contra control externo</text><rect x="500" y="709" width="140" height="30" rx="15" fill="#1e4337"/><text x="532" y="730" fill="#55dfae" font-size="13">Coinciden</text></g>
  <rect x="105" y="766" width="580" height="30" rx="9" fill="#193029"/><text x="121" y="787" fill="#91aaa0" font-size="12" font-family="Arial, sans-serif">Todos los registros son ficticios y no contienen información financiera personal.</text>

  <rect x="743" y="431" width="782" height="391" rx="23" fill="#12231e" stroke="#29483e"/>
  <text x="773" y="474" fill="#55dfae" font-size="14" letter-spacing="2" font-family="Arial, sans-serif">MODELO Y MEDIDAS</text>
  <g font-family="Arial, sans-serif"><rect x="773" y="513" width="210" height="115" rx="15" fill="#1a3029"/><rect x="773" y="513" width="210" height="36" rx="15" fill="#28604e"/><text x="790" y="538" fill="#fff" font-size="14" font-weight="700">CALENDARIO</text><text x="790" y="577" fill="#a3b9b1" font-size="13">Fecha · mes · semana</text><text x="790" y="601" fill="#a3b9b1" font-size="13">Año · día</text>
  <rect x="1042" y="513" width="210" height="115" rx="15" fill="#1a3029"/><rect x="1042" y="513" width="210" height="36" rx="15" fill="#28604e"/><text x="1059" y="538" fill="#fff" font-size="14" font-weight="700">MOVIMIENTOS</text><text x="1059" y="577" fill="#a3b9b1" font-size="13">Fecha · concepto</text><text x="1059" y="601" fill="#a3b9b1" font-size="13">Categoría · importe</text>
  <rect x="1311" y="513" width="184" height="115" rx="15" fill="#1a3029"/><rect x="1311" y="513" width="184" height="36" rx="15" fill="#28604e"/><text x="1328" y="538" fill="#fff" font-size="14" font-weight="700">CATEGORÍA</text><text x="1328" y="577" fill="#a3b9b1" font-size="13">Nombre · grupo</text><text x="1328" y="601" fill="#a3b9b1" font-size="13">Presupuesto</text></g>
  <g stroke="#55dfae" stroke-width="2"><line x1="983" y1="570" x2="1042" y2="570"/><line x1="1252" y1="570" x2="1311" y2="570"/></g>
  <text x="773" y="681" fill="#8fa69e" font-size="13" font-family="Arial, sans-serif">MEDIDAS PRINCIPALES</text>
  <g font-family="Arial, sans-serif"><rect x="773" y="704" width="166" height="75" rx="13" fill="#17362d"/><text x="792" y="733" fill="#8db5a6" font-size="12">GASTO</text><text x="792" y="760" fill="#fff" font-size="19" font-weight="700">Suma de egresos</text><rect x="955" y="704" width="166" height="75" rx="13" fill="#17362d"/><text x="974" y="733" fill="#8db5a6" font-size="12">AHORRO</text><text x="974" y="760" fill="#fff" font-size="19" font-weight="700">Ingreso − gasto</text><rect x="1137" y="704" width="166" height="75" rx="13" fill="#17362d"/><text x="1156" y="733" fill="#8db5a6" font-size="12">USO</text><text x="1156" y="760" fill="#fff" font-size="19" font-weight="700">Gasto / meta</text><rect x="1319" y="704" width="176" height="75" rx="13" fill="#17362d"/><text x="1338" y="733" fill="#8db5a6" font-size="12">DESVIACIÓN</text><text x="1338" y="760" fill="#fff" font-size="19" font-weight="700">Real − plan</text></g>
</svg>
