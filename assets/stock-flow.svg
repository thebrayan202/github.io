<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Flujo y arquitectura de StockPilot</title>
  <desc id="desc">Diagrama del registro de movimientos, validación transaccional, base de datos y actualización de alertas.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151d2b"/><stop offset="1" stop-color="#0a1019"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#f2c55c"/></marker></defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <text x="76" y="83" fill="#fff" font-size="33" font-weight="700" font-family="Arial, sans-serif">StockPilot · Flujo técnico</text><text x="76" y="115" fill="#8391a5" font-size="16" font-family="Arial, sans-serif">De un movimiento validado a una decisión de reposición</text>
  <rect x="76" y="156" width="1448" height="246" rx="23" fill="#131d2c" stroke="#303b4d"/>
  <text x="106" y="196" fill="#f2c55c" font-size="14" letter-spacing="2" font-family="Arial, sans-serif">FLUJO PRINCIPAL</text>
  <g font-family="Arial, sans-serif"><rect x="106" y="229" width="220" height="126" rx="17" fill="#202b3c" stroke="#3b495e"/><text x="133" y="265" fill="#8795aa" font-size="13">01 · INTERFAZ</text><text x="133" y="297" fill="#fff" font-size="17" font-weight="700">Registrar movimiento</text><text x="133" y="324" fill="#8d9aad" font-size="13">Entrada, salida o ajuste</text>
  <rect x="388" y="229" width="220" height="126" rx="17" fill="#202b3c" stroke="#3b495e"/><text x="415" y="265" fill="#8795aa" font-size="13">02 · VALIDACIÓN</text><text x="415" y="297" fill="#fff" font-size="17" font-weight="700">Aplicar reglas</text><text x="415" y="324" fill="#8d9aad" font-size="13">Cantidad, estado y stock</text>
  <rect x="670" y="229" width="220" height="126" rx="17" fill="#2a251b" stroke="#7d6127"/><text x="697" y="265" fill="#b99d57" font-size="13">03 · TRANSACCIÓN</text><text x="697" y="297" fill="#f2c55c" font-size="17" font-weight="700">Guardar de forma segura</text><text x="697" y="324" fill="#bba568" font-size="13">Movimiento + existencia</text>
  <rect x="952" y="229" width="220" height="126" rx="17" fill="#202b3c" stroke="#3b495e"/><text x="979" y="265" fill="#8795aa" font-size="13">04 · CONSULTA</text><text x="979" y="297" fill="#fff" font-size="17" font-weight="700">Calcular indicadores</text><text x="979" y="324" fill="#8d9aad" font-size="13">Rotación y stock mínimo</text>
  <rect x="1234" y="229" width="260" height="126" rx="17" fill="#202b3c" stroke="#3b495e"/><text x="1261" y="265" fill="#8795aa" font-size="13">05 · DECISIÓN</text><text x="1261" y="297" fill="#fff" font-size="17" font-weight="700">Mostrar alerta</text><text x="1261" y="324" fill="#8d9aad" font-size="13">Cantidad sugerida y prioridad</text></g>
  <g stroke="#f2c55c" stroke-width="3" marker-end="url(#arrow)"><line x1="326" y1="292" x2="377" y2="292"/><line x1="608" y1="292" x2="659" y2="292"/><line x1="890" y1="292" x2="941" y2="292"/><line x1="1172" y1="292" x2="1223" y2="292"/></g>

  <rect x="76" y="432" width="886" height="389" rx="23" fill="#131d2c" stroke="#303b4d"/>
  <text x="106" y="474" fill="#f2c55c" font-size="14" letter-spacing="2" font-family="Arial, sans-serif">MODELO DE DATOS</text>
  <g font-family="Arial, sans-serif"><rect x="108" y="512" width="230" height="121" rx="15" fill="#1e2939"/><rect x="108" y="512" width="230" height="38" rx="15" fill="#795e23"/><text x="128" y="538" fill="#fff8e6" font-size="15" font-weight="700">PRODUCTO</text><text x="128" y="578" fill="#a4b0c1" font-size="13">id · nombre · categoría</text><text x="128" y="602" fill="#a4b0c1" font-size="13">stock mínimo · estado</text>
  <rect x="397" y="512" width="250" height="151" rx="15" fill="#1e2939"/><rect x="397" y="512" width="250" height="38" rx="15" fill="#795e23"/><text x="417" y="538" fill="#fff8e6" font-size="15" font-weight="700">MOVIMIENTO</text><text x="417" y="578" fill="#a4b0c1" font-size="13">id · producto · usuario</text><text x="417" y="602" fill="#a4b0c1" font-size="13">tipo · cantidad · fecha</text><text x="417" y="626" fill="#a4b0c1" font-size="13">motivo · referencia</text>
  <rect x="706" y="512" width="224" height="121" rx="15" fill="#1e2939"/><rect x="706" y="512" width="224" height="38" rx="15" fill="#795e23"/><text x="726" y="538" fill="#fff8e6" font-size="15" font-weight="700">USUARIO</text><text x="726" y="578" fill="#a4b0c1" font-size="13">id · nombre · rol</text><text x="726" y="602" fill="#a4b0c1" font-size="13">estado · último acceso</text></g>
  <g stroke="#748399" stroke-width="2" fill="none"><path d="M338 572h59"/><path d="M647 572h59"/></g><g fill="#f2c55c"><circle cx="368" cy="572" r="5"/><circle cx="676" cy="572" r="5"/></g>
  <rect x="108" y="697" width="822" height="91" rx="15" fill="#1a2433"/><text x="134" y="730" fill="#8795a9" font-size="13" font-family="Arial, sans-serif">PRINCIPIO DE TRAZABILIDAD</text><text x="134" y="763" fill="#e9edf3" font-size="16" font-family="Arial, sans-serif">La existencia se obtiene de movimientos válidos; cada cambio conserva fecha, usuario y motivo.</text>

  <rect x="990" y="432" width="534" height="389" rx="23" fill="#131d2c" stroke="#303b4d"/>
  <text x="1020" y="474" fill="#f2c55c" font-size="14" letter-spacing="2" font-family="Arial, sans-serif">REGLAS CRÍTICAS</text>
  <g font-family="Arial, sans-serif"><rect x="1020" y="506" width="474" height="62" rx="13" fill="#1c2737"/><circle cx="1050" cy="537" r="12" fill="#f2c55c"/><text x="1046" y="542" fill="#18202b" font-size="13" font-weight="700">1</text><text x="1077" y="532" fill="#fff" font-size="15">Una salida no puede superar el stock disponible.</text><text x="1077" y="552" fill="#8492a6" font-size="12">Se rechaza antes de guardar.</text>
  <rect x="1020" y="581" width="474" height="62" rx="13" fill="#1c2737"/><circle cx="1050" cy="612" r="12" fill="#f2c55c"/><text x="1046" y="617" fill="#18202b" font-size="13" font-weight="700">2</text><text x="1077" y="607" fill="#fff" font-size="15">Todo ajuste necesita un motivo verificable.</text><text x="1077" y="627" fill="#8492a6" font-size="12">Evita cambios sin contexto.</text>
  <rect x="1020" y="656" width="474" height="62" rx="13" fill="#1c2737"/><circle cx="1050" cy="687" r="12" fill="#f2c55c"/><text x="1046" y="692" fill="#18202b" font-size="13" font-weight="700">3</text><text x="1077" y="682" fill="#fff" font-size="15">Producto inactivo no admite movimientos nuevos.</text><text x="1077" y="702" fill="#8492a6" font-size="12">El historial permanece consultable.</text>
  <rect x="1020" y="731" width="474" height="62" rx="13" fill="#2a251b" stroke="#6d5626"/><circle cx="1050" cy="762" r="12" fill="#f2c55c"/><text x="1046" y="767" fill="#18202b" font-size="13" font-weight="700">4</text><text x="1077" y="757" fill="#fff" font-size="15">Stock bajo genera alerta con acción sugerida.</text><text x="1077" y="777" fill="#bda96d" font-size="12">Prioridad según rotación y faltante.</text></g>
</svg>
