<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Comparador de viajes de Rumbo Perú</title>
  <desc id="desc">Interfaz móvil y web para comparar transporte público, taxi por aplicativo, auto, bicicleta y caminata según tiempo y costo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#153654"/><stop offset=".52" stop-color="#0b2135"/><stop offset="1" stop-color="#07131f"/></linearGradient>
    <linearGradient id="map" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#143954"/><stop offset="1" stop-color="#0b273a"/></linearGradient>
    <filter id="shadow"><feDropShadow dy="18" stdDeviation="22" flood-color="#02070d" flood-opacity=".34"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="30"/></filter>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <circle cx="1380" cy="120" r="180" fill="#287fd0" opacity=".12" filter="url(#soft)"/>
  <circle cx="160" cy="790" r="210" fill="#8be36b" opacity=".08" filter="url(#soft)"/>
  <rect x="34" y="34" width="1532" height="832" rx="25" fill="#0b1928" stroke="#27445c"/>

  <rect x="34" y="34" width="1532" height="76" rx="25" fill="#0e2032"/>
  <circle cx="78" cy="72" r="21" fill="#8be36b"/>
  <path d="M68 72h18m-4-6 6 6-6 6" fill="none" stroke="#102313" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="112" y="81" fill="#f5fbff" font-size="27" font-weight="700" font-family="Arial, sans-serif">Rumbo Perú</text>
  <g fill="#8099ad" font-size="14" font-family="Arial, sans-serif"><text x="1055" y="79">Planificar</text><text x="1148" y="79">Guardados</text><text x="1244" y="79">Cobertura</text></g>
  <rect x="1351" y="51" width="183" height="42" rx="12" fill="#17344e" stroke="#28577c"/>
  <circle cx="1374" cy="72" r="6" fill="#8be36b"/><text x="1390" y="77" fill="#b9cbd8" font-size="12" font-family="Arial, sans-serif">Ubicación protegida</text>

  <g font-family="Arial, sans-serif">
    <text x="70" y="164" fill="#fff" font-size="31" font-weight="700">¿A dónde quieres ir?</text>
    <text x="70" y="192" fill="#7892a7" font-size="14">Compara la ruta que mejor encaja con tu tiempo y presupuesto.</text>
    <rect x="70" y="220" width="520" height="64" rx="15" fill="#11273a" stroke="#294963"/>
    <circle cx="96" cy="252" r="7" fill="#8be36b"/><text x="117" y="244" fill="#6f8ba1" font-size="10">ORIGEN</text><text x="117" y="266" fill="#edf6fc" font-size="15">Tu ubicación · Estación Los Jardines</text>
    <path d="M553 242l10 10-10 10M563 252h-18" fill="none" stroke="#7f99ad" stroke-width="2"/>
    <rect x="70" y="298" width="520" height="64" rx="15" fill="#11273a" stroke="#294963"/>
    <circle cx="96" cy="330" r="7" fill="#5aa7ff"/><text x="117" y="322" fill="#6f8ba1" font-size="10">DESTINO</text><text x="117" y="344" fill="#edf6fc" font-size="15">Estación La Cultura · San Borja</text>
    <rect x="70" y="380" width="164" height="44" rx="12" fill="#8be36b"/><text x="113" y="407" fill="#102313" font-size="14" font-weight="700">Buscar rutas</text>
    <rect x="245" y="380" width="152" height="44" rx="12" fill="#12283a" stroke="#294963"/><text x="274" y="407" fill="#a5bac9" font-size="13">Salir ahora</text>
    <rect x="408" y="380" width="182" height="44" rx="12" fill="#12283a" stroke="#294963"/><text x="440" y="407" fill="#a5bac9" font-size="13">Menos transbordos</text>
  </g>

  <rect x="70" y="453" width="890" height="371" rx="20" fill="url(#map)" stroke="#28506c"/>
  <text x="96" y="488" fill="#eff8fd" font-size="17" font-weight="700" font-family="Arial, sans-serif">Ruta seleccionada · Lima</text>
  <rect x="799" y="469" width="134" height="28" rx="14" fill="#163d58"/><text x="819" y="488" fill="#8eb2c9" font-size="11" font-family="Arial, sans-serif">CASO DE INTERFAZ</text>
  <g stroke="#1f4863" stroke-width="1" opacity=".7"><path d="M96 535h838M96 601h838M96 667h838M96 733h838M178 515v280M282 515v280M386 515v280M490 515v280M594 515v280M698 515v280M802 515v280"/></g>
  <path d="M96 520c86 24 82 79 159 94 90 18 74 83 167 87 83 4 104-63 186-56 91 8 89 85 170 88 62 2 89-39 156-27v89H96Z" fill="#102f45" stroke="#245676" stroke-width="2"/>
  <path d="M218 713c43-56 94-99 145-122 46-20 93-5 140-31 51-29 83-26 139-11 55 15 105 4 157-33" fill="none" stroke="#8be36b" stroke-width="7" stroke-linecap="round"/>
  <path d="M218 713c43-56 94-99 145-122 46-20 93-5 140-31 51-29 83-26 139-11 55 15 105 4 157-33" fill="none" stroke="#dfffd2" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 14"/>
  <circle cx="218" cy="713" r="15" fill="#102638" stroke="#8be36b" stroke-width="5"/><circle cx="799" cy="516" r="15" fill="#5aa7ff" stroke="#d5e9ff" stroke-width="4"/>
  <g font-family="Arial, sans-serif"><rect x="126" y="724" width="190" height="52" rx="12" fill="#0d2233" stroke="#2e637f"/><text x="145" y="746" fill="#fff" font-size="13" font-weight="700">Los Jardines</text><text x="145" y="765" fill="#7896aa" font-size="10">Punto de partida</text>
  <rect x="760" y="535" width="168" height="52" rx="12" fill="#0d2233" stroke="#2e637f"/><text x="779" y="557" fill="#fff" font-size="13" font-weight="700">La Cultura</text><text x="779" y="576" fill="#7896aa" font-size="10">Destino</text></g>
  <g fill="#5aa7ff"><circle cx="365" cy="590" r="7"/><circle cx="503" cy="560" r="7"/><circle cx="642" cy="549" r="7"/></g>
  <g fill="#83a2b7" font-size="10" font-family="Arial, sans-serif"><text x="338" y="576">Pirámide del Sol</text><text x="476" y="546">Gamarra</text><text x="618" y="535">La Victoria</text></g>

  <rect x="986" y="144" width="548" height="680" rx="21" fill="#0e2031" stroke="#29475f" filter="url(#shadow)"/>
  <g font-family="Arial, sans-serif">
    <text x="1016" y="182" fill="#fff" font-size="20" font-weight="700">Opciones para este viaje</text>
    <text x="1016" y="207" fill="#7590a5" font-size="12">Ordenadas por equilibrio entre tiempo y costo</text>

    <rect x="1016" y="232" width="488" height="143" rx="17" fill="#153247" stroke="#8be36b"/>
    <rect x="1034" y="247" width="104" height="24" rx="12" fill="#8be36b"/><text x="1052" y="264" fill="#122414" font-size="10" font-weight="700">RECOMENDADO</text>
    <circle cx="1058" cy="311" r="22" fill="#214c60"/><path d="M1047 311h22m-16-8-6 8 6 8m10-16 6 8-6 8" fill="none" stroke="#8be36b" stroke-width="2.5"/>
    <text x="1094" y="307" fill="#f6fbff" font-size="17" font-weight="700">Línea 1 · Metro</text><text x="1094" y="329" fill="#88a4b5" font-size="11">0 transbordos · caminata según origen</text>
    <text x="1324" y="303" fill="#fff" font-size="20" font-weight="700">S/ 1.50</text><text x="1324" y="324" fill="#8be36b" font-size="10">TARIFA ADULTA OFICIAL</text>
    <line x1="1038" y1="346" x2="1482" y2="346" stroke="#2a5065"/><text x="1038" y="365" fill="#7896aa" font-size="10">Tiempo calculado al consultar · fuente tarifaria visible</text>

    <rect x="1016" y="391" width="488" height="112" rx="16" fill="#12283a" stroke="#294b64"/>
    <circle cx="1058" cy="434" r="22" fill="#1c3c52"/><path d="M1044 440h28l-3-13h-22l-3 13Zm5 0v5m18-5v5" fill="none" stroke="#5aa7ff" stroke-width="2.5"/>
    <text x="1094" y="427" fill="#f6fbff" font-size="16" font-weight="700">Taxi por aplicativo</text><text x="1094" y="449" fill="#839fb2" font-size="11">Precio dinámico según tráfico y demanda</text>
    <rect x="1342" y="416" width="140" height="38" rx="11" fill="#1e4260"/><text x="1365" y="440" fill="#a9d4ff" font-size="11" font-weight="700">Consultar precio ↗</text>
    <text x="1038" y="484" fill="#6f8da2" font-size="10">El precio se confirma en el proveedor antes de pedir el viaje.</text>

    <rect x="1016" y="519" width="488" height="112" rx="16" fill="#12283a" stroke="#294b64"/>
    <circle cx="1058" cy="562" r="22" fill="#1f3d3a"/><path d="M1044 568h28l-3-13h-22l-3 13Zm5 0v5m18-5v5" fill="none" stroke="#8be36b" stroke-width="2.5"/>
    <text x="1094" y="555" fill="#f6fbff" font-size="16" font-weight="700">Auto propio</text><text x="1094" y="577" fill="#839fb2" font-size="11">Distancia, rendimiento, combustible y peajes</text>
    <text x="1348" y="555" fill="#e6f5df" font-size="14" font-weight="700">Costo calculado</text><text x="1348" y="576" fill="#7ea397" font-size="10">con datos de Facilito</text>
    <text x="1038" y="612" fill="#6f8da2" font-size="10">Puedes guardar el rendimiento de tu vehículo sin publicar la placa.</text>

    <rect x="1016" y="647" width="235" height="112" rx="16" fill="#12283a" stroke="#294b64"/>
    <circle cx="1052" cy="690" r="19" fill="#2a344b"/><circle cx="1044" cy="697" r="8" fill="none" stroke="#b99cff" stroke-width="2"/><circle cx="1065" cy="697" r="8" fill="none" stroke="#b99cff" stroke-width="2"/><path d="M1044 697l9-18 12 18m-17-9h14" fill="none" stroke="#b99cff" stroke-width="2"/>
    <text x="1082" y="687" fill="#f6fbff" font-size="14" font-weight="700">Bicicleta</text><text x="1082" y="707" fill="#839fb2" font-size="10">S/ 0 directo</text><text x="1038" y="741" fill="#6f8da2" font-size="9">Solo si la ruta es viable</text>
    <rect x="1267" y="647" width="237" height="112" rx="16" fill="#12283a" stroke="#294b64"/>
    <circle cx="1303" cy="690" r="19" fill="#283a43"/><path d="M1303 677v13l-8 14m8-14 9 13m-9-8-10 2" fill="none" stroke="#f1c56c" stroke-width="2.3" stroke-linecap="round"/>
    <text x="1333" y="687" fill="#f6fbff" font-size="14" font-weight="700">Caminando</text><text x="1333" y="707" fill="#839fb2" font-size="10">S/ 0 directo</text><text x="1289" y="741" fill="#6f8da2" font-size="9">Para distancias razonables</text>

    <rect x="1016" y="777" width="488" height="27" rx="9" fill="#0c1b29"/><circle cx="1032" cy="790" r="4" fill="#f1c56c"/><text x="1043" y="794" fill="#708b9f" font-size="9">Tiempo y costos variables se actualizan al consultar. No son una garantía.</text>
  </g>
</svg>
