<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Metodología y fuentes de FarmaRadar Perú</title>
  <desc id="desc">Diagrama de fuentes oficiales peruanas, proceso geoespacial, variables de oportunidad y fórmula de escenario financiero.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c2930"/><stop offset="1" stop-color="#071419"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0l10 5-10 5z" fill="#54d6dd"/></marker></defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <text x="72" y="80" fill="#fff" font-size="33" font-weight="700" font-family="Arial, sans-serif">FarmaRadar Perú · Metodología verificable</text><text x="72" y="112" fill="#78969c" font-size="16" font-family="Arial, sans-serif">Datos observados + análisis espacial + supuestos financieros editables</text>

  <rect x="72" y="151" width="1456" height="240" rx="22" fill="#10242a" stroke="#28505a"/>
  <text x="102" y="193" fill="#54d6dd" font-size="14" letter-spacing="2" font-family="Arial, sans-serif">01 · FUENTES Y RESPONSABILIDAD</text>
  <g font-family="Arial, sans-serif"><rect x="102" y="226" width="300" height="120" rx="16" fill="#152d33"/><text x="126" y="259" fill="#54d6dd" font-size="13">DIGEMID</text><text x="126" y="291" fill="#fff" font-size="18" font-weight="700">Farmacias y precios</text><text x="126" y="317" fill="#79979d" font-size="12">Autorización, ubicación y oferta</text>
  <rect x="426" y="226" width="300" height="120" rx="16" fill="#152d33"/><text x="450" y="259" fill="#74a7ff" font-size="13">INEI</text><text x="450" y="291" fill="#fff" font-size="18" font-weight="700">Población por distrito</text><text x="450" y="317" fill="#79979d" font-size="12">Demanda potencial y cobertura</text>
  <rect x="750" y="226" width="300" height="120" rx="16" fill="#152d33"/><text x="774" y="259" fill="#b995ff" font-size="13">SUSALUD · RENIPRESS</text><text x="774" y="291" fill="#fff" font-size="18" font-weight="700">Establecimientos de salud</text><text x="774" y="317" fill="#79979d" font-size="12">IPRESS, categoría y ubicación</text>
  <rect x="1074" y="226" width="424" height="120" rx="16" fill="#18343a" stroke="#35727a"/><text x="1098" y="259" fill="#f2c55c" font-size="13">ENTRADA DEL USUARIO</text><text x="1098" y="291" fill="#fff" font-size="18" font-weight="700">Costos y supuestos del negocio</text><text x="1098" y="317" fill="#8fb0b5" font-size="12">Alquiler · planilla · margen · ticket · días</text></g>

  <rect x="72" y="421" width="934" height="407" rx="22" fill="#10242a" stroke="#28505a"/>
  <text x="102" y="463" fill="#54d6dd" font-size="14" letter-spacing="2" font-family="Arial, sans-serif">02 · PIPELINE GEOESPACIAL</text>
  <g font-family="Arial, sans-serif"><rect x="102" y="499" width="230" height="116" rx="16" fill="#152d33"/><text x="126" y="531" fill="#78989e" font-size="12">PYTHON · PANDAS</text><text x="126" y="563" fill="#fff" font-size="18" font-weight="700">Limpiar y normalizar</text><text x="126" y="589" fill="#78969c" font-size="12">Ubigeo, nombres y fechas</text>
  <rect x="394" y="499" width="230" height="116" rx="16" fill="#152d33"/><text x="418" y="531" fill="#78989e" font-size="12">GEOPANDAS</text><text x="418" y="563" fill="#fff" font-size="18" font-weight="700">Geocodificar</text><text x="418" y="589" fill="#78969c" font-size="12">Puntos y límites distritales</text>
  <rect x="686" y="499" width="286" height="116" rx="16" fill="#17353b" stroke="#34747c"/><text x="710" y="531" fill="#6fcbd1" font-size="12">POSTGRESQL · POSTGIS</text><text x="710" y="563" fill="#54d6dd" font-size="18" font-weight="700">Cruzar por radio y distrito</text><text x="710" y="589" fill="#83aab0" font-size="12">Distancias, conteos y cobertura</text></g>
  <g stroke="#54d6dd" stroke-width="3" marker-end="url(#arrow)"><line x1="332" y1="557" x2="383" y2="557"/><line x1="624" y1="557" x2="675" y2="557"/></g>
  <text x="102" y="666" fill="#78969c" font-size="12" letter-spacing="1" font-family="Arial, sans-serif">VARIABLES DEL ÍNDICE</text>
  <g font-family="Arial, sans-serif"><rect x="102" y="691" width="161" height="96" rx="14" fill="#142c32"/><text x="120" y="721" fill="#54d6dd" font-size="12">DEMANDA</text><text x="120" y="750" fill="#fff" font-size="14" font-weight="700">Población /</text><text x="120" y="770" fill="#fff" font-size="14" font-weight="700">farmacia</text>
  <rect x="279" y="691" width="161" height="96" rx="14" fill="#142c32"/><text x="297" y="721" fill="#54d6dd" font-size="12">COMPETENCIA</text><text x="297" y="750" fill="#fff" font-size="14" font-weight="700">Locales dentro</text><text x="297" y="770" fill="#fff" font-size="14" font-weight="700">del radio</text>
  <rect x="456" y="691" width="161" height="96" rx="14" fill="#142c32"/><text x="474" y="721" fill="#54d6dd" font-size="12">ACCESO</text><text x="474" y="750" fill="#fff" font-size="14" font-weight="700">Distancia a</text><text x="474" y="770" fill="#fff" font-size="14" font-weight="700">IPRESS</text>
  <rect x="633" y="691" width="161" height="96" rx="14" fill="#142c32"/><text x="651" y="721" fill="#54d6dd" font-size="12">MERCADO</text><text x="651" y="750" fill="#fff" font-size="14" font-weight="700">Oferta y rango</text><text x="651" y="770" fill="#fff" font-size="14" font-weight="700">de precios</text>
  <rect x="810" y="691" width="162" height="96" rx="14" fill="#142c32"/><text x="828" y="721" fill="#f2c55c" font-size="12">COSTOS</text><text x="828" y="750" fill="#fff" font-size="14" font-weight="700">Gasto fijo y</text><text x="828" y="770" fill="#fff" font-size="14" font-weight="700">margen</text></g>

  <rect x="1036" y="421" width="492" height="407" rx="22" fill="#10242a" stroke="#28505a"/>
  <text x="1066" y="463" fill="#54d6dd" font-size="14" letter-spacing="2" font-family="Arial, sans-serif">03 · ESCENARIO FINANCIERO</text>
  <g font-family="Arial, sans-serif"><rect x="1066" y="499" width="432" height="63" rx="14" fill="#152d33"/><text x="1088" y="524" fill="#78969c" font-size="11">VENTA MENSUAL</text><text x="1088" y="548" fill="#fff" font-size="16" font-weight="700">tickets/día × ticket promedio × días</text>
  <rect x="1066" y="576" width="432" height="63" rx="14" fill="#152d33"/><text x="1088" y="601" fill="#78969c" font-size="11">MARGEN BRUTO</text><text x="1088" y="625" fill="#fff" font-size="16" font-weight="700">venta mensual × % de margen</text>
  <rect x="1066" y="653" width="432" height="63" rx="14" fill="#18343a" stroke="#34717a"/><text x="1088" y="678" fill="#77adb3" font-size="11">RESULTADO OPERATIVO</text><text x="1088" y="702" fill="#54d6dd" font-size="16" font-weight="700">margen − alquiler − personal − otros</text>
  <rect x="1066" y="730" width="432" height="68" rx="14" fill="#2c2c22" stroke="#6a6336"/><text x="1088" y="755" fill="#d8c56f" font-size="11">PUNTO DE EQUILIBRIO</text><text x="1088" y="779" fill="#f2e8ba" font-size="15" font-weight="700">costos fijos / margen por ticket</text></g>
  <text x="72" y="865" fill="#6e8d93" font-size="12" font-family="Arial, sans-serif">El análisis orienta una decisión; no sustituye validación del local, permisos sanitarios, tránsito peatonal ni evaluación financiera profesional.</text>
</svg>
