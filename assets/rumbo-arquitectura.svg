<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura y cobertura de Rumbo Perú</title>
  <desc id="desc">Diagrama del proceso que combina ubicación, mapas, datos de transporte y reglas de costos para generar rutas multimodales verificables.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#132f49"/><stop offset="1" stop-color="#07131f"/></linearGradient>
    <filter id="shadow"><feDropShadow dy="14" stdDeviation="18" flood-color="#00040a" flood-opacity=".32"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0l8 4-8 4" fill="#537792"/></marker>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <rect x="36" y="36" width="1528" height="828" rx="25" fill="#0b1928" stroke="#29475e"/>
  <g font-family="Arial, sans-serif">
    <circle cx="79" cy="79" r="21" fill="#8be36b"/><path d="M69 79h18m-4-6 6 6-6 6" fill="none" stroke="#102313" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="113" y="87" fill="#f5fbff" font-size="27" font-weight="700">Rumbo Perú</text>
    <text x="113" y="108" fill="#7691a5" font-size="11">Arquitectura de datos y cobertura</text>
    <rect x="1332" y="59" width="198" height="39" rx="12" fill="#16354f" stroke="#2b5879"/><text x="1361" y="83" fill="#a8c1d2" font-size="11">DISEÑO DE SOLUCIÓN</text>

    <text x="70" y="170" fill="#fff" font-size="30" font-weight="700">Una ruta útil también explica de dónde salió</text>
    <text x="70" y="198" fill="#7691a5" font-size="14">Cada alternativa conserva su fuente, fecha, cobertura y nivel de certeza.</text>

    <text x="70" y="246" fill="#8be36b" font-size="11" font-weight="700" letter-spacing="1.5">01 · CONSULTA</text>
    <rect x="70" y="266" width="280" height="197" rx="18" fill="#10273a" stroke="#2b5069" filter="url(#shadow)"/>
    <circle cx="106" cy="307" r="18" fill="#1f443f"/><path d="M106 295a10 10 0 0 0-10 10c0 8 10 18 10 18s10-10 10-18a10 10 0 0 0-10-10Zm0 7a4 4 0 1 1 0 8 4 4 0 0 1 0-8Z" fill="#8be36b"/>
    <text x="137" y="304" fill="#fff" font-size="16" font-weight="700">Origen y destino</text><text x="137" y="325" fill="#7895a9" font-size="11">GPS opcional o ingreso manual</text>
    <line x1="94" y1="349" x2="326" y2="349" stroke="#29465d"/>
    <text x="94" y="379" fill="#a9bdca" font-size="12">Prioridad del usuario</text>
    <rect x="94" y="395" width="68" height="28" rx="10" fill="#8be36b"/><text x="111" y="414" fill="#122415" font-size="10" font-weight="700">Rápida</text>
    <rect x="170" y="395" width="68" height="28" rx="10" fill="#18354b"/><text x="186" y="414" fill="#95adbd" font-size="10">Barata</text>
    <rect x="246" y="395" width="80" height="28" rx="10" fill="#18354b"/><text x="257" y="414" fill="#95adbd" font-size="10">Sin cambios</text>
    <text x="94" y="448" fill="#668399" font-size="10">La ubicación no se publica ni se guarda por defecto.</text>

    <text x="399" y="246" fill="#5aa7ff" font-size="11" font-weight="700" letter-spacing="1.5">02 · FUENTES</text>
    <g filter="url(#shadow)">
      <rect x="399" y="266" width="216" height="88" rx="16" fill="#11283b" stroke="#2a4d67"/>
      <rect x="631" y="266" width="216" height="88" rx="16" fill="#11283b" stroke="#2a4d67"/>
      <rect x="399" y="370" width="216" height="93" rx="16" fill="#11283b" stroke="#2a4d67"/>
      <rect x="631" y="370" width="216" height="93" rx="16" fill="#11283b" stroke="#2a4d67"/>
    </g>
    <text x="423" y="298" fill="#fff" font-size="14" font-weight="700">OpenStreetMap</text><text x="423" y="320" fill="#7895a9" font-size="10">Calles, accesos y red vial</text><text x="423" y="339" fill="#5aa7ff" font-size="9">COBERTURA NACIONAL</text>
    <text x="655" y="298" fill="#fff" font-size="14" font-weight="700">GTFS + ATU</text><text x="655" y="320" fill="#7895a9" font-size="10">Rutas, paraderos y tarifas</text><text x="655" y="339" fill="#f1c56c" font-size="9">SEGÚN CIUDAD Y OPERADOR</text>
    <text x="423" y="402" fill="#fff" font-size="14" font-weight="700">Taxi por aplicativo</text><text x="423" y="424" fill="#7895a9" font-size="10">Precio consultado al momento</text><text x="423" y="443" fill="#b99cff" font-size="9">VALOR DINÁMICO</text>
    <text x="655" y="402" fill="#fff" font-size="14" font-weight="700">Facilito + peajes</text><text x="655" y="424" fill="#7895a9" font-size="10">Combustible y costo vial</text><text x="655" y="443" fill="#8be36b" font-size="9">ESTIMACIÓN EXPLICABLE</text>

    <path d="M350 364h31" stroke="#537792" stroke-width="2" marker-end="url(#arrow)"/><path d="M862 364h32" stroke="#537792" stroke-width="2" marker-end="url(#arrow)"/>

    <text x="895" y="246" fill="#b99cff" font-size="11" font-weight="700" letter-spacing="1.5">03 · MOTOR</text>
    <rect x="895" y="266" width="304" height="197" rx="18" fill="#13293c" stroke="#3b5d75" filter="url(#shadow)"/>
    <circle cx="935" cy="307" r="20" fill="#29364d"/><path d="M925 307h20m-10-10v20" stroke="#b99cff" stroke-width="3"/>
    <text x="970" y="302" fill="#fff" font-size="16" font-weight="700">Planificador multimodal</text><text x="970" y="324" fill="#819cad" font-size="11">OpenTripPlanner + OSRM</text>
    <g font-size="11"><rect x="922" y="352" width="250" height="31" rx="9" fill="#172f43"/><text x="940" y="372" fill="#aac0ce">1. Normalizar rutas y horarios</text>
    <rect x="922" y="391" width="250" height="31" rx="9" fill="#172f43"/><text x="940" y="411" fill="#aac0ce">2. Calcular tiempos y costos</text>
    <rect x="922" y="430" width="250" height="18" rx="9" fill="#203844"/><rect x="922" y="430" width="198" height="18" rx="9" fill="#8be36b" opacity=".8"/><text x="946" y="443" fill="#102313" font-size="8" font-weight="700">CONTROL DE COBERTURA Y VIGENCIA</text></g>

    <path d="M1199 364h31" stroke="#537792" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="1231" y="246" fill="#8be36b" font-size="11" font-weight="700" letter-spacing="1.5">04 · RESPUESTA</text>
    <rect x="1231" y="266" width="299" height="197" rx="18" fill="#10273a" stroke="#2b5069" filter="url(#shadow)"/>
    <text x="1258" y="303" fill="#fff" font-size="16" font-weight="700">Alternativas comparables</text>
    <g font-size="11"><circle cx="1265" cy="338" r="5" fill="#8be36b"/><text x="1280" y="342" fill="#aac0ce">Tiempo y hora de llegada</text><circle cx="1265" cy="371" r="5" fill="#5aa7ff"/><text x="1280" y="375" fill="#aac0ce">Costo y tipo de cálculo</text><circle cx="1265" cy="404" r="5" fill="#b99cff"/><text x="1280" y="408" fill="#aac0ce">Caminata y transbordos</text></g>
    <rect x="1258" y="426" width="78" height="23" rx="11" fill="#244437"/><text x="1274" y="442" fill="#9dea82" font-size="9">OFICIAL</text>
    <rect x="1344" y="426" width="85" height="23" rx="11" fill="#243b50"/><text x="1357" y="442" fill="#8eb9df" font-size="9">ESTIMADO</text>
    <rect x="1437" y="426" width="70" height="23" rx="11" fill="#3a314c"/><text x="1452" y="442" fill="#c4aef2" font-size="9">DINÁMICO</text>

    <rect x="70" y="510" width="1460" height="296" rx="20" fill="#0f2132" stroke="#29485f"/>
    <text x="98" y="549" fill="#fff" font-size="20" font-weight="700">Cobertura diseñada para crecer sin ocultar vacíos</text>
    <text x="98" y="575" fill="#7590a5" font-size="12">La app habilita cada modo solo cuando la consulta tiene una fuente y una fecha reconocibles.</text>

    <rect x="98" y="605" width="1404" height="42" rx="10" fill="#142b3e"/>
    <g fill="#7894a8" font-size="10" font-weight="700"><text x="122" y="631">ÁMBITO</text><text x="361" y="631">TRANSPORTE PÚBLICO</text><text x="664" y="631">AUTO / CAMINATA / BICI</text><text x="1006" y="631">TAXI POR APP</text><text x="1280" y="631">RESPUESTA</text></g>
    <line x1="98" y1="661" x2="1502" y2="661" stroke="#29485f"/><line x1="98" y1="721" x2="1502" y2="721" stroke="#29485f"/>
    <g font-size="12"><text x="122" y="696" fill="#fff" font-weight="700">Lima y Callao</text><text x="361" y="696" fill="#9edc8a">ATU, Metro y feeds disponibles</text><text x="664" y="696" fill="#a8c1d2">Red vial nacional</text><text x="1006" y="696" fill="#a8c1d2">Consulta al proveedor</text><rect x="1280" y="677" width="167" height="31" rx="10" fill="#244437"/><text x="1304" y="697" fill="#a7ed91" font-size="10" font-weight="700">COBERTURA AMPLIADA</text>
    <text x="122" y="756" fill="#fff" font-weight="700">Otras ciudades del Perú</text><text x="361" y="756" fill="#f1c56c">Solo con datos verificables</text><text x="664" y="756" fill="#a8c1d2">Red vial nacional</text><text x="1006" y="756" fill="#a8c1d2">Según disponibilidad</text><rect x="1280" y="737" width="167" height="31" rx="10" fill="#403a28"/><text x="1306" y="757" fill="#f4d98f" font-size="10" font-weight="700">COBERTURA VISIBLE</text></g>
    <rect x="98" y="778" width="1404" height="1" fill="#29485f"/>
    <circle cx="112" cy="794" r="4" fill="#8be36b"/><text x="124" y="798" fill="#6e899d" font-size="9">Si faltan recorridos o tarifas, el sistema informa “sin datos suficientes” y mantiene disponibles los modos que sí puede calcular.</text>
  </g>
</svg>
