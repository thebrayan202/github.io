<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard de inventario StockPilot</title>
  <desc id="desc">Panel con indicadores, alertas de stock bajo, gráfico de movimientos y tabla de reposición.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a2a"/><stop offset="1" stop-color="#0a101b"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity=".22"/></filter>
  </defs>
  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
  <rect x="34" y="34" width="255" height="832" rx="22" fill="#151f30" stroke="#2a3548"/>
  <circle cx="77" cy="83" r="20" fill="#f2c55c"/><path d="M67 83h20M77 73v20" stroke="#172030" stroke-width="4"/>
  <text x="112" y="90" fill="#f7f4ea" font-size="27" font-weight="700" font-family="Arial, sans-serif">StockPilot</text>
  <text x="65" y="150" fill="#78869d" font-size="14" font-family="Arial, sans-serif" letter-spacing="2">OPERACIÓN</text>
