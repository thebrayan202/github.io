  <text x="661" y="190" fill="#8694a8" font-size="15">UNIDADES DISPONIBLES</text><text x="661" y="252" fill="#fff" font-size="43" font-weight="700">3,842</text><text x="661" y="278" fill="#9ba8ba" font-size="14">Valor actualizado</text>
