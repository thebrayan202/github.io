  <rect x="1139" y="465" width="384" height="57" rx="12" fill="#1b2331"/><circle cx="1167" cy="493" r="8" fill="#ff8178"/><text x="1190" y="489" fill="#e9edf3" font-size="15">Tinta impresora 664</text><text x="1190" y="509" fill="#8896aa" font-size="12">Sin existencias</text><text x="1455" y="498" fill="#ff8178" font-size="13">Urgente</text>
  <rect x="1139" y="532" width="384" height="57" rx="12" fill="#1b2331"/><circle cx="1167" cy="560" r="8" fill="#74a7ff"/><text x="1190" y="556" fill="#e9edf3" font-size="15">Mouse inalámbrico</text><text x="1190" y="576" fill="#8896aa" font-size="12">Alta rotación esta semana</text><text x="1455" y="565" fill="#74a7ff" font-size="13">Revisar</text></g>

  <rect x="337" y="649" width="1214" height="183" rx="20" fill="#151f30" stroke="#2b3648"/>
