  <line x1="365" y1="744" x2="1522" y2="744" stroke="#2a3547"/>
  <g fill="#e8edf4" font-size="15" font-family="Arial, sans-serif"><text x="365" y="780">Cable HDMI 2 m</text><text x="760" y="780">3</text><text x="900" y="780">10</text><text x="1040" y="780">20 unidades</text></g>
  <rect x="1260" y="758" width="114" height="30" rx="15" fill="#3c321d"/><text x="1285" y="779" fill="#f2c55c" font-size="13" font-family="Arial, sans-serif">Pendiente</text>
