  <rect x="52" y="746" width="218" height="88" rx="15" fill="#1c283b"/>
  <circle cx="82" cy="784" r="17" fill="#39475d"/><text x="109" y="780" fill="#e7ebf2" font-size="15" font-family="Arial, sans-serif">Responsable</text><text x="109" y="805" fill="#7f8da2" font-size="13" font-family="Arial, sans-serif">Almacén general</text>

